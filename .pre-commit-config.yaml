# Everything runs through `uv run`, so the hooks use the versions pinned in uv.lock, as CI does.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # freshdags checks its own docs, using the working copy of the tool.
      - id: freshdags
        name: freshdags
        entry: uv run freshdags check --uncommitted
        language: system
        pass_filenames: false
        always_run: true
